services:
  # ── Flask API (Web Service) ──────────────────────────────────────────────
  - type: web
    name: eventzone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:create_app() --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://eventzone-app.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── React Frontend (Static Site) ────────────────────────────────────────
  - type: web
    name: eventzone-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://eventzone-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
